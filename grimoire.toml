# Grimoire book configuration for the @deckyard/koofr documentation.

[book]
title = "@deckyard/koofr"
description = "A client for the Koofr cloud storage API"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-koofr/"
repoUrl = "https://github.com/deckyard/deck-koofr"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-koofr/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
