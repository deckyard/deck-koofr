[package]
name = "@deckyard/koofr"
version = "0.1.0"
description = "A client for the Koofr cloud storage API: mounts, files, search, public links, receivers and the trash"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The deck talks to Koofr (or another provider of the same API) over HTTPS,
# so it opens sockets. No `exec`, no `sql`.
capabilities = ["net"]
keywords = ["koofr", "cloud-storage", "files", "sharing", "upload", "download", "api"]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-koofr/main/deck.toml"
homepage = "https://github.com/deckyard/deck-koofr"
manual = "https://deckyard.github.io/deck-koofr/"

# 0.26.0: the floor for new decks. The overlay's `httpd.rawQuery` and the
# examples' `os.hasEnv` are not in 0.25.0.
# Only the default binary: `jennifer-tiny` has no `net` capability.
[engines]
jennifer = ">=0.26.0"
